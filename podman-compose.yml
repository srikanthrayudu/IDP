version: '3.8'

services:
  db:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_DB: smartcity_complaints
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartcity_complaints"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      containerfile: Containerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.containers.internal:5433/smartcity_complaints
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - ML_SERVICE_URL=http://ml-service:5000/predict
      - DEMO_ADMIN_USERNAME=admin
      - DEMO_ADMIN_PASSWORD=Admin@123
      - DEMO_WARD_USERNAME=ward
      - DEMO_WARD_PASSWORD=Ward@123
      - DEMO_WARD_COUNT=20
      - DEMO_USER_USERNAME=citizen
      - DEMO_USER_PASSWORD=Citizen@123
      - DEMO_USER_COUNT=10
      - DEMO_WORKER_USERNAME=worker
      - DEMO_WORKER_PASSWORD=Worker@123
      - DEMO_WORKER_COUNT=10
      - SPRING_SQL_INIT_MODE=always
    volumes:
      - ./backend/uploads:/app/uploads
    extra_hosts:
      - "host.containers.internal:host-gateway"
    depends_on:
      - db
      - ml-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      containerfile: Containerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api

  ml-service:
    build:
      context: ./ml-service
      containerfile: Containerfile
    ports:
      - "5000:5000"
    environment:
      - AUTO_TRAIN=1
      - DATA_PATH=/app/data.csv
      - OUT_DIR=/app/artifacts
      - MODEL_PATH=/app/artifacts/model.pkl
      - PRIORITY_MODEL_PATH=/app/artifacts/priority_model.pkl
    volumes:
      - ./ml-service/data.csv:/app/data.csv:ro
      - ./ml-service/artifacts:/app/artifacts

volumes:
  pgdata:
