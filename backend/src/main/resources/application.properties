spring.application.name=backend

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartcity_complaints}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ML Service URL
ml.service.url=${ML_SERVICE_URL:http://localhost:5000/predict}

# ML Confidence Thresholds
ml.category.confidence.min=${ML_CATEGORY_CONFIDENCE_MIN:0.45}
ml.priority.confidence.min=${ML_PRIORITY_CONFIDENCE_MIN:0.55}

# Upload Constraints
app.upload.image.max-bytes=${APP_UPLOAD_IMAGE_MAX_BYTES:5242880}
app.upload.image.allowed-types=${APP_UPLOAD_IMAGE_ALLOWED_TYPES:image/jpeg,image/png,image/webp}
app.upload.image.upload-dir=${APP_UPLOAD_IMAGE_DIR:uploads}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# Demo Data Defaults
# demo.admin.username, demo.admin.password, demo.ward.username, demo.ward.password
# are configurable via environment variables with the same names (uppercased).
demo.admin.username=${DEMO_ADMIN_USERNAME:admin}
demo.admin.password=${DEMO_ADMIN_PASSWORD:Admin@123}
demo.ward.username=${DEMO_WARD_USERNAME:ward}
demo.ward.password=${DEMO_WARD_PASSWORD:Ward@123}
demo.ward.count=${DEMO_WARD_COUNT:20}
demo.user.count=${DEMO_USER_COUNT:10}
demo.worker.count=${DEMO_WORKER_COUNT:5}
demo.user.username=${DEMO_USER_USERNAME:citizen}
demo.user.password=${DEMO_USER_PASSWORD:Citizen@123}
demo.worker.username=${DEMO_WORKER_USERNAME:worker}
demo.worker.password=${DEMO_WORKER_PASSWORD:Worker@123}
demo.department.password=${DEMO_DEPARTMENT_PASSWORD:Department@123}
demo.customer.care.username=${DEMO_CUSTOMER_CARE_USERNAME:care}
demo.customer.care.password=${DEMO_CUSTOMER_CARE_PASSWORD:Care@123}

# SQL Seed Data
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Seed Strategy
app.seed.java.enabled=true
